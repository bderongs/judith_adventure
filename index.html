<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projet Judith - Étape 1</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div id="health-ui"></div>
    <div id="world-menu"></div>
    <div id="coords-ui" style="position: fixed; top: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; font-family: monospace; pointer-events: none; font-size: 14px; z-index: 1000;">X: 0 | Y: 0 | Z: 0</div>
    <div id="multiplayer-status" style="position: fixed; bottom: 10px; right: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; font-family: sans-serif; pointer-events: none; font-size: 12px; z-index: 1000;">Multiplayer: Disconnected</div>
    <div id="tutorial-ui" class="hidden">
        <div class="tutorial-content">
            <h2>Bienvenue <span id="tutorial-name"></span>, voici les instructions :</h2>
            <ul>
                <li><strong>Z, Q, S, D</strong> (ou W, A, S, D) : Se déplacer</li>
                <li><strong>Espace</strong> : Sauter</li>
                <li><strong>Clic Gauche</strong> (ou Y) : Attaquer</li>
            </ul>
            <button id="tutorial-close">Jouer !</button>
        </div>
    </div>
    <!-- Chest proximity hint -->
    <div id="chest-hint" class="hidden">
        <span class="chest-hint-icon">📦</span>
        <span>Attaque pour ouvrir</span>
    </div>

    <!-- Chest message popup -->
    <div id="chest-popup" class="hidden">
        <div class="chest-popup-inner">
            <div id="chest-popup-emoji" class="chest-popup-emoji"></div>
            <div id="chest-popup-text" class="chest-popup-text"></div>
        </div>
    </div>

    <canvas id="renderCanvas"></canvas>
    <script type="module" src="./src/main.js"></script>
</body>
</html>
